<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Athlete Check Executive Email Signature</title>
</head>
<body>
<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial, Helvetica, sans-serif;">
  <tr>
    <td style="padding-right:20px; vertical-align:top;">
      <img src="https://theathletecheck.com/logo.png" alt="The Athlete Check" width="180" style="display:block;border:0;">
    </td>
    <td style="border-left:3px solid #0D47C9;padding-left:20px;vertical-align:top;">
      <div style="font-size:20px;font-weight:bold;color:#0A1F5C;">{{FULL_NAME}}</div>
      <div style="font-size:14px;color:#0D47C9;font-weight:bold;">{{TITLE}}</div>

      <div style="margin-top:10px;font-size:13px;color:#333333;line-height:1.6;">
        📞 {{PHONE}}<br>
        ✉️ {{EMAIL}}<br>
        🌐 TheAthleteCheck.com
      </div>

      <div style="margin-top:12px;font-size:12px;color:#666666;max-width:450px;">
        Built By Student Athletes. Backed By IronMind. Designed for the Next Level.
      </div>

      <div style="margin-top:10px;">
        <a href="https://theathletecheck.com" style="background:#0D47C9;color:#ffffff;text-decoration:none;padding:8px 14px;border-radius:4px;font-size:12px;font-weight:bold;">
          TAKE THE ATHLETE CHECK
        </a>
      </div>
    </td>
  </tr>
</table>
</body>
</html>
