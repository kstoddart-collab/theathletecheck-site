<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Roster notifications (setup only)</title>
</head>
<body>
<!--
  This page exists only so Netlify registers the form below at deploy time.
  The "Are you in?" function posts to it so Kenny gets an email on every answer.
  Nobody needs to visit this page.
-->
<form name="roster-signup" data-netlify="true" hidden>
  <input type="text" name="Player name">
  <input type="text" name="Answer">
  <input type="text" name="When">
  <input type="text" name="Running total in">
</form>
<p>Setup page for Bolles Leaders roster notifications.</p>
</body>
</html>
